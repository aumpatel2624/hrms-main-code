  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

h3:       1.5rem;\n  --fs-h4:       1.125rem;\n  --fs-body:     1rem;\n  --fs-small:    0.875rem;\n  --fs-eyebrow:  0.75rem;\n\n  --lh-display: 1.05;\n  --lh-heading: 1.2;\n  --lh-body:    1.6;\n  --lh-tight:   1.3;\n\n  --tracking-tight:   -0.02em;\n  --tracking-normal:  0;\n  --tracking-eyebrow: 0.12em;\n\n  --fw-regular:  400;\n  --fw-medium:   500;\n  --fw-semibold: 600;\n  --fw-bold:     700;\n  --fw-black:    800;\n\n  /* ---- Spacing (4px base) ---------------------------------------- */\n  --space-0: 0;\n  --space-1: 0.25rem;   /* 4  */\n  --space-2: 0.5rem;    /* 8  */\n  --space-3: 0.75rem;   /* 12 */\n  --space-4: 1rem;      /* 16 */\n  --space-5: 1.25rem;   /* 20 */\n  --space-6: 1.5rem;    /* 24 */\n  --space-8: 2rem;      /* 32 */\n  --space-10: 2.5rem;   /* 40 */\n  --space-12: 3rem;     /* 48 */\n  --space-16: 4rem;     /* 64 */\n  --space-20: 5rem;     /* 80 */\n  --space-24: 6rem;     /* 96 */\n  --space-32: 8rem;     /* 128 */\n\n  /* ---- Radii ----------------------------------------------------- */\n  --radius-sm:   4px;\n  --radius-md:   8px;\n  --radius-lg:   16px;\n  --radius-xl:   24px;\n  --radius-pill: 999px;\n\n  /* ---- Shadows --------------------------------------------------- */\n  --shadow-1: 0 1px 2px rgba(8, 24, 42, 0.06);\n  --shadow-2: 0 4px 12px rgba(8, 24, 42, 0.08);\n  --shadow-3: 0 12px 32px rgba(8, 24, 42, 0.12);\n  --shadow-4: 0 24px 64px rgba(8, 24, 42, 0.16);\n  --shadow-inset-focus: inset 0 0 0 2px var(--color-orange-500);\n\n  /* ---- Motion ---------------------------------------------------- */\n  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);\n  --ease-in:  cubic-bezier(0.6, 0.0, 0.8, 0.2);\n  --dur-1:    120ms;\n  --dur-2:    200ms;\n  --dur-3:    320ms;\n\n  /* ---- Layout ---------------------------------------------------- */\n  --container-max: 1200px;\n  --gutter:        24px;\n  --header-h:      80px;\n\n  /* ---- Aliases (semantic) --------------------------------------- */\n  --fg1: var(--color-fg);\n  --fg2: var(--color-fg-muted);\n  --fg3: var(--color-fg-subtle);\n  --bg1: var(--color-bg);\n  --bg2: var(--color-bg-alt);\n  --bg3: var(--color-bg-tint);\n  --accent:    var(--color-orange-500);\n  --accent-fg: #FFFFFF;\n  --primary:    var(--color-navy-700);\n  --primary-fg: #FFFFFF;\n}\n\n/* =====================================================================\n   Element-level semantic styles\n   ===================================================================== */\n\nhtml { box-sizing: border-box; }\n*, *::before, *::after { box-sizing: inherit; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--color-fg);\n  background: var(--color-bg);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, h5, h6 {\n  margin: 0 0 var(--space-4) 0;\n  font-family: var(--font-display);\n  color: var(--color-fg);\n  letter-spacing: var(--tracking-tight);\n  text-wrap: balance;\n}\n\nh1 { font-size: var(--fs-h1); line-height: var(--lh-heading); font-weight: var(--fw-bold); }\nh2 { font-size: var(--fs-h2); line-height: var(--lh-heading); font-weight: var(--fw-bold); }\nh3 { font-size: var(--fs-h3); line-height: var(--lh-tight);   font-weight: var(--fw-semibold); }\nh4 { font-size: var(--fs-h4); line-height: var(--lh-tight);   font-weight: var(--fw-semibold); }\n\n.display {\n  font-size: var(--fs-display);\n  line-height: var(--lh-display);\n  font-weight: var(--fw-black);\n  letter-spacing: var(--tracking-tight);\n}\n\np {\n  margin: 0 0 var(--space-4) 0;\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--color-fg);\n  text-wrap: pretty;\n}\n\n.eyebrow {\n  font-size: var(--fs-eyebrow);\n  letter-spacing: var(--tracking-eyebrow);\n  text-transform: uppercase;\n  font-weight: var(--fw-semibold);\n  color: var(--color-orange-500);\n}\n\nsmall, .small { font-size: var(--fs-small); color: var(--color-fg-muted); }\n\na {\n  color: var(--color-navy-500);\n  text-decoration: none;\n  transition: color var(--dur-2) var(--ease-out);\n}\na:hover  { color: var(--color-orange-500); text-decoration: underline; text-underline-offset: 3px; }\na:focus-visible {\n  outline: none;\n  box-shadow: var(--shadow-inset-focus);\n  border-radius: var(--radius-sm);\n}\n\ncode, pre, kbd, samp { font-family: var(--font-mono); font-size: 0.9em; }\ncode { background: var(--color-bg-alt); padding: 0.1em 0.35em; border-radius: var(--radius-sm); }\n\nhr {\n  border: 0;\n  border-top: 1px solid var(--color-border);\n  margin: var(--space-12) 0;\n}\n<\u002Fstyle>\n  <script src=\"8db5e48d-d5cd-4556-93d6-4e580674f205\"><\u002Fscript>\n  <style>\n    body{margin:0;background:#F5F7FA;}\n    ::-webkit-scrollbar{width:10px;}\n    ::-webkit-scrollbar-thumb{background:#D9DEE5;border-radius:6px;}\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width:100%;min-height:100vh;font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#F5F7FA;display:flex;flex-direction:column;align-items:center;padding:32px 16px 64px;box-sizing:border-box;\">\n\n  <div style=\"width:100%;max-width:1040px;margin-bottom:20px;\">\n    <div style=\"font-size:26px;font-weight:800;color:#0E2A47;letter-spacing:-0.01em;\">Apidel Technologies — Organization Chart<\u002Fdiv>\n    <div style=\"font-size:14px;color:#475467;margin-top:4px;\">{{ empCount }} employees · {{ visibleCount }} shown · all Active · click a row to expand or collapse its team<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"width:100%;max-width:1040px;display:flex;align-items:center;gap:10px;margin-bottom:16px;position:sticky;top:16px;z-index:10;\">\n    <input type=\"text\" placeholder=\"Search name, code, email, title, department, or location…\" value=\"{{ query }}\" sc-camel-on-input=\"{{ onSearch }}\" style=\"flex:1;padding:12px 16px;border-radius:999px;border:1px solid #D9DEE5;font-size:14px;color:#0E2A47;outline:none;box-shadow:0 1px 2px rgba(8,24,4 pth < 2) expanded.add(node.key);\n      node.children.forEach(c => expandDepth(c, depth + 1));\n    };\n    this._tree.roots.forEach(r => expandDepth(r, 0));\n    this._expanded = expanded;\n  }\n\n  toggle = (key) => {\n    const s = this._expanded;\n    if (s.has(key)) s.delete(key); else s.add(key);\n    this.forceUpdate();\n  };\n\n  expandAll = () => {\n    const s = this._expanded;\n    const add = (n) => { s.add(n.key); n.children.forEach(add); };\n    this._tree.roots.forEach(add);\n    this.forceUpdate();\n  };\n\n  collapseAll = () => { this._expanded.clear(); this.forceUpdate(); };\n\n  onSearch = (e) => this.setState({ query: e.target.value });\n\n  initials(name) {\n    const parts = name.split(' ').filter(Boolean);\n    return ((parts[0] || '')[0] || '') + ((parts[1] || '')[0] || '');\n  }\n\n  colorsFor(depth) {\n    if (depth === 0) return { bg: '#08182A', fg: '#fff', sub: 'rgba(255,255,255,.72)', meta: 'rgba(255,255,255,.55)', av: '#F37021', avfg: '#fff' };\n    if (depth === 1) return { bg: '#fff', fg: '#0E2A47', sub: '#475467', meta: '#8A94A3', av: '#0E2A47', avfg: '#fff' };\n    if (depth === 2) return { bg: '#fff', fg: '#0E2A47', sub: '#475467', meta: '#8A94A3', av: '#1F4C7E', avfg: '#fff' };\n    return { bg: '#fff', fg: '#0E2A47', sub: '#475467', meta: '#8A94A3', av: '#EAF1F8', avfg: '#1F4C7E' };\n  }\n\n  flatten(query) {\n    const q = query.trim().toLowerCase();\n    const forceOpen = !!q;\n    const matchesSubtree = (n) => {\n      if (n._m != null) return n._m;\n      const hay = [n.name, n.code, n.email, n.title, n.loc, n.mode, n.gender].join(' ').toLowerCase();\n      const m = hay.includes(q) || n.children.some(matchesSubtree);\n      n._m = m;\n      return m;\n    };\n    const out = [];\n    const visit = (node, depth) => {\n      if (q && !matchesSubtree(node)) return;\n      out.push({ node, depth });\n      const open = forceOpen ? true : this._expanded.has(node.key);\n      if (open) node.children.forEach(c => visit(c, depth + 1
